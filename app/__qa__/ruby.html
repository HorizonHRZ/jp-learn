<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>QA · 振假名与罗马音真排版检查</title>
<!--
  这个页面是 `tools/qa-ruby.mjs` 的载荷。

  为什么要单独做一页：
  用户报了两个**只有真排版才能发现**的问题：
    ① 「々」这类叠字（日々／人々／時々）注音时，"罗马音掉到和振假名同一行"；
    ② 多音汉字（今日 读 きょう / こんにち，等）注音不一定是歌里唱的那个读音。

  问题 ① 是**几何问题**：假 DOM（test-render）能证明建出了 <rt> 和
  <span class="jpr-romaji">，但量不出"它们是不是挤在了同一行"。
  所以必须用真浏览器 getBoundingClientRect() 量。

  ⚠️ 这个目录（app/__qa__/）只放自检载荷，不是应用的一部分，
     不会被 index.html 引用，用户也不会看到。
-->
<link rel="stylesheet" href="/css/theme.css">
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); }
  #mount { max-width: 760px; margin: 0 auto; padding: 18px; }
  .case { margin: 0 0 8px; }
  .case-label { font-size: .72rem; color: var(--text-faint); font-family: var(--mono); }
</style>
</head>
<body>
<div id="mount"></div>
<script type="module" src="/app/__qa__/ruby.js"></script>
</body>
</html>
